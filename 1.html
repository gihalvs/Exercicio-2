<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fusion de carros</title>
</head>
<body>
    <script>
        // declaração de carro
        const carros = ["jetta","civic","byd"];
        
        //loop carros
        for(let car in carros){
            // 
            document.write("<br>Carro: * + car");
        }
    </script>
</body>
</html>
